name: Upstream alerts

# Opens an `upstream-sync` issue for every pull request merged into
# algolia/docsearch and for every upstream release (scripts/upstreamAlerts.ts).
on:
  schedule:
    - cron: '17 * * * *'
  # Throwaway: run on push to test before merge. Never merge this commit.
  push:
    branches: [upstream-alerts-test]
  workflow_dispatch:
    inputs:
      since:
        description: Report upstream changes after this ISO date (empty uses the script's default)
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-alerts

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Open issues for new upstream changes
        run: bun scripts/upstreamAlerts.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSIGNEES: tharropoulos
          UPSTREAM_SINCE: ${{ inputs.since || '2026-09-30T00:00:00Z' }}
